apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler

metadata:
  name: helpdesk-vpa

spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: helpdesk

  updatePolicy:
    updateMode: "Recreate"

  resourcePolicy:
    containerPolicies:
      - containerName: helpdesk

        minAllowed:
          cpu: 100m
          memory: 128Mi

        maxAllowed:
          cpu: "2"
          memory: 2Gi

        controlledResources:
          - cpu
          - memory