apiVersion: apps/v1
kind: Deployment

metadata:
  name: kubernetes-platform

spec:
  replicas: {{ .Values.replicaCount }}

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  selector:
    matchLabels:
      app: kubernetes-platform

  template:
    metadata:
      labels:
        app: kubernetes-platform

    spec:
      containers:
        - name: kubernetes-platform
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}

          ports:
            - name: http
              containerPort: {{ .Values.containerPort }}

          envFrom:
            - configMapRef:
                name: kubernetes-platform-config

          volumeMounts:
            - name: data
              mountPath: /app/data

          resources:
            requests:
              cpu: {{ .Values.resources.requests.cpu }}
              memory: {{ .Values.resources.requests.memory }}
            limits:
              cpu: {{ .Values.resources.limits.cpu }}
              memory: {{ .Values.resources.limits.memory }}

          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            failureThreshold: 30

          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            failureThreshold: 3

          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            failureThreshold: 3

      # HERE
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: helpdesk-data

      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: kubernetes-platform

      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: kubernetes-platform
                topologyKey: kubernetes.io/hostname