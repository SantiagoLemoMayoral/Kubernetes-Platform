apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: kubernetes-platform-dev
  namespace: argocd

spec:
  project: kubernetes-platform

  source:
    repoURL: https://github.com/SantiagoLemoMayoral/kubernetes-platform.git
    targetRevision: main
    path: helm/backend

    helm:
      valueFiles:
        - values.yaml
        - values-dev.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: kubernetes-platform-dev

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true