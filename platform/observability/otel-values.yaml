mode: deployment

image:
  repository: otel/opentelemetry-collector-contrib

config:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

  processors:
    memory_limiter:
      check_interval: 1s
      limit_mib: 256

    batch:
      timeout: 5s

  exporters:
    prometheus:
      endpoint: 0.0.0.0:8889

    otlp/tempo:
      endpoint: tempo:4317
      tls:
        insecure: true

    otlphttp/loki:
      endpoint: http://loki:3100/otlp

  service:
    pipelines:

      metrics:
        receivers:
          - otlp
        processors:
          - memory_limiter
          - batch
        exporters:
          - prometheus

      logs:
        receivers:
          - otlp
        processors:
          - memory_limiter
          - batch
        exporters:
          - otlphttp/loki

      traces:
        receivers:
          - otlp
        processors:
          - memory_limiter
          - batch
        exporters:
          - otlp/tempo

ports:
  otlp:
    enabled: true
    containerPort: 4317
    servicePort: 4317

  otlp-http:
    enabled: true
    containerPort: 4318
    servicePort: 4318

  prometheus:
    enabled: true
    containerPort: 8889
    servicePort: 8889