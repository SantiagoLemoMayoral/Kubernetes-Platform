apiVersion: v1
kind: Namespace
metadata:
  name: kubernetes-platform-staging
  labels:
    environment: staging
    managed-by: argocd

---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: staging-quota
  namespace: kubernetes-platform-staging
spec:
  hard:
    requests.cpu: "4"
    requests.memory: 8Gi
    limits.cpu: "8"
    limits.memory: 16Gi

---
apiVersion: v1
kind: LimitRange
metadata:
  name: staging-limits
  namespace: kubernetes-platform-staging
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 100m
        memory: 128Mi
      default:
        cpu: 500m
        memory: 512Mi