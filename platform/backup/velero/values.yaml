# backup/velero/values.yaml

configuration:
  backupStorageLocation:
    - name: default
      provider: aws
      bucket: kubernetes-platform-velero-backups

      config:
        region: us-east-1

  volumeSnapshotLocation:
    - name: default
      provider: aws

      config:
        region: us-east-1


initContainers:
  - name: velero-plugin-for-aws
    image: velero/velero-plugin-for-aws:v1.12.0

    volumeMounts:
      - mountPath: /target
        name: plugins


serviceAccount:
  server:
    create: true

    annotations:
      eks.amazonaws.com/role-arn: arn:aws:iam::<AWS_ACCOUNT_ID>:role/velero-role


credentials:
  useSecret: false


snapshotsEnabled: true
backupsEnabled: true